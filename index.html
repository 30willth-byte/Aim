<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Aim Trainer - Auto Relocate & Matte Targets</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
  </style>
</head>
<body>

  <a-scene>
    <!-- Clean & Clear Lighting for High Target Visibility in Dark Room -->
    <a-entity light="type: ambient; color: #FFFFFF; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; color: #FFFFFF; intensity: 0.8" position="0 8 0"></a-entity>
    <a-entity light="type: directional; color: #FFFFFF; intensity: 0.5" position="-6 6 6"></a-entity>

    <!-- Camera & Custom X/Y Reticle Crosshair with Raycaster far range -->
    <a-camera position="0 1.6 0" look-controls>
      <a-entity position="0 0 -1" raycaster="objects: .clickable; far: 20; interval: 50">
        <!-- Center Ring -->
        <a-ring radius-inner="0.006" radius-outer="0.009" color="#38bdf8"></a-ring>
        <!-- X Axis (Horizontal Line) -->
        <a-plane width="0.03" height="0.003" color="#38bdf8"></a-plane>
        <!-- Y Axis (Vertical Line) -->
        <a-plane width="0.003" height="0.03" color="#38bdf8"></a-plane>
        <!-- Fuse Cursor -->
        <a-cursor color="#60a5fa" fuse="true" fuse-timeout="200" opacity="0.5" scale="0.5 0.5 0.5"></a-cursor>
      </a-entity>
    </a-camera>

    <!-- Pitch-Black Room Environment Geometry -->
    <!-- Floor -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="26" height="26" color="#050505" material="roughness: 1.0; metalness: 0.0"></a-plane>
    <!-- Ceiling -->
    <a-plane position="0 8 0" rotation="90 0 0" width="26" height="26" color="#050505" material="roughness: 1.0; metalness: 0.0"></a-plane>
    <!-- Surrounding Dark Walls -->
    <a-box position="0 4 -13" width="26" height="8" depth="0.1" color="#000000" material="roughness: 1.0; metalness: 0.0"></a-box>
    <a-box position="0 4 13" width="26" height="8" depth="0.1" color="#000000" material="roughness: 1.0; metalness: 0.0"></a-box>
    <a-box position="-13 4 0" rotation="0 90 0" width="26" height="8" depth="0.1" color="#000000" material="roughness: 1.0; metalness: 0.0"></a-box>
    <a-box position="13 4 0" rotation="0 -90 0" width="26" height="8" depth="0.1" color="#000000" material="roughness: 1.0; metalness: 0.0"></a-box>

    <!-- 3D HUD: Realtime Timer & Score Billboard -->
    <a-entity position="0 3.6 -3.5">
      <a-text id="score-text" value="Score: 0" position="-1.2 0 0" color="#ffffff" width="6" align="center"></a-text>
      <a-text id="timer-text" value="Time: 60s" position="1.2 0 0" color="#ef4444" width="6" align="center"></a-text>
    </a-entity>

    <!-- Container where dynamic spheres are generated -->
    <a-entity id="target-container"></a-entity>

    <!-- Start Overlay UI -->
    <a-entity id="start-screen" position="0 1.8 -2.5">
      <a-plane width="2.4" height="1.4" color="#0f172a" material="opacity: 0.95"></a-plane>
      <a-text value="VR AIM TRAINER" position="0 0.4 0.01" align="center" width="4.5" color="#ffffff"></a-text>
      <a-text value="Hit static & moving red spheres!\nLook 360° around you." position="0 0.1 0.01" align="center" width="2.3" color="#94a3b8"></a-text>
      
      <a-box id="start-btn" class="clickable" position="0 -0.35 0.05" width="1.2" height="0.35" depth="0.05" color="#2563eb">
        <a-text value="START" position="0 0 0.03" align="center" width="4" color="#ffffff"></a-text>
      </a-box>
    </a-entity>

    <!-- Game Over Summary UI -->
    <a-entity id="gameover-screen" position="0 1.8 -2.5" visible="false">
      <a-plane width="2.4" height="1.4" color="#0f172a" material="opacity: 0.95"></a-plane>
      <a-text value="TIME'S UP!" position="0 0.45 0.01" align="center" width="4.5" color="#ef4444"></a-text>
      <a-text id="final-score-text" value="Score: 0" position="0 0.15 0.01" align="center" width="3.8" color="#ffffff"></a-text>
      
      <a-box id="restart-btn" class="clickable" position="0 -0.35 0.05" width="1.2" height="0.35" depth="0.05" color="#16a34a">
        <a-text value="RETRY" position="0 0 0.03" align="center" width="4" color="#ffffff"></a-text>
      </a-box>
    </a-entity>
  </a-scene>

  <script>
    // Register custom target-mover A-Frame component for smooth inline movement
    AFRAME.registerComponent('target-mover', {
      schema: {
        type: { type: 'string', default: 'static' }, // static, updown, sideside
        speed: { type: 'number', default: 2 },
        amplitude: { type: 'number', default: 0.9 }
      },
      init: function () {
        this.basePosition = Object.assign({}, this.el.object3D.position);
        this.time = Math.random() * 100; // Random phase offset
      },
      update: function () {
        // Reset base position when position attribute changes on respawn/relocate
        this.basePosition = Object.assign({}, this.el.object3D.position);
      },
      tick: function (time, timeDelta) {
        if (!isPlaying) return;
        if (this.data.type === 'static') return;

        this.time += (timeDelta / 1000) * this.data.speed;
        const offset = Math.sin(this.time) * this.data.amplitude;

        if (this.data.type === 'updown') {
          // Oscillate Y position
          this.el.object3D.position.y = this.basePosition.y + offset;
        } else if (this.data.type === 'sideside') {
          // Oscillate horizontally perpendicular to center angle
          const angle = Math.atan2(this.basePosition.z, this.basePosition.x) + Math.PI / 2;
          this.el.object3D.position.x = this.basePosition.x + Math.cos(angle) * offset;
          this.el.object3D.position.z = this.basePosition.z + Math.sin(angle) * offset;
        }
      }
    });

    // Game variables
    const TARGET_COUNT = 6;
    const AUTO_RELOCATE_DELAY_MS = 5000; // 5 seconds timer per target
    let score = 0;
    let timeRemaining = 60;
    let timerInterval = null;
    let isPlaying = false;
    let audioCtx = null;

    // UI Handles
    const targetContainer = document.getElementById('target-container');
    const scoreText = document.getElementById('score-text');
    const timerText = document.getElementById('timer-text');
    const finalScoreText = document.getElementById('final-score-text');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('gameover-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    // Synthesize clear "ding" bell chime via Web Audio API
    function playDingSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        // High pitch chime tones
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(1320, now); // E6
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(2640, now); // E7

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.22);
        osc2.stop(now + 0.22);
      } catch (e) {}
    }

    // Check if coordinate is near HUD area (0, 3.6, -3.5) to avoid overlapping
    function isNearHUDZone(x, y, z) {
      const hudX = 0, hudY = 3.6, hudZ = -3.5;
      const dx = x - hudX;
      const dy = y - hudY;
      const dz = z - hudZ;
      const distSquared = dx * dx + dy * dy + dz * dz;
      return distSquared < 4.0; // Keep at least 2.0 meters clear of the HUD center
    }

    // Helper to generate 360° positions with HUD avoidance
    function getRandom360Coordinates() {
      let coords;
      let attempts = 0;
      do {
        const angle = Math.random() * Math.PI * 2;
        const distance = 2.5 + Math.random() * 3.5; // Radius 2.5m - 6.0m
        const x = Math.cos(angle) * distance;
        const z = Math.sin(angle) * distance;
        const y = 1.2 + Math.random() * 2.5; // Height 1.2m - 3.7m
        coords = { x, y, z };
        attempts++;
      } while (isNearHUDZone(coords.x, coords.y, coords.z) && attempts < 20);

      return coords;
    }

    // Helper to get random motion type ('updown' or 'sideside')
    function getRandomMotionType() {
      return Math.random() < 0.5 ? 'updown' : 'sideside';
    }

    // Recalculates motion types across all targets so strictly 1 or 2 targets move at a time
    function updateAllTargetMovements() {
      const spheres = Array.from(targetContainer.querySelectorAll('a-sphere'));
      if (spheres.length === 0) return;

      // Randomly pick either 1 or 2 targets to be moving
      const numMoving = Math.random() < 0.5 ? 1 : 2;

      // Shuffle indices array to select moving targets randomly
      const indices = spheres.map((_, idx) => idx);
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }

      const movingIndices = new Set(indices.slice(0, numMoving));

      spheres.forEach((sphere, index) => {
        const speed = 1.5 + Math.random() * 2.0;
        if (movingIndices.has(index)) {
          const moveType = getRandomMotionType();
          sphere.setAttribute('target-mover', `type: ${moveType}; speed: ${speed}; amplitude: 0.9`);
        } else {
          sphere.setAttribute('target-mover', `type: static; speed: 0; amplitude: 0`);
        }
      });
    }

    // Clears existing auto-relocate timer on a target
    function clearTargetRelocateTimer(sphere) {
      if (sphere.relocateTimeoutId) {
        clearTimeout(sphere.relocateTimeoutId);
        sphere.relocateTimeoutId = null;
      }
    }

    // Schedules auto-relocation for a target sphere if not hit within 5 seconds
    function startTargetRelocateTimer(sphere) {
      clearTargetRelocateTimer(sphere);
      if (!isPlaying) return;

      sphere.relocateTimeoutId = setTimeout(() => {
        if (!isPlaying) return;
        relocateSphere(sphere, false);
      }, AUTO_RELOCATE_DELAY_MS);
    }

    // Relocates sphere to new spot and redistributes 1-2 moving targets rule
    function relocateSphere(sphere, wasClicked = false) {
      const pos = getRandom360Coordinates();
      sphere.setAttribute('position', `${pos.x.toFixed(2)} ${pos.y.toFixed(2)} ${pos.z.toFixed(2)}`);
      
      updateAllTargetMovements();
      startTargetRelocateTimer(sphere);
    }

    // Instantiate 6 red target spheres in the scene
    function createTargets() {
      targetContainer.innerHTML = '';
      for (let i = 0; i < TARGET_COUNT; i++) {
        const sphere = document.createElement('a-sphere');
        sphere.setAttribute('class', 'clickable');
        sphere.setAttribute('color', '#ef4444');
        sphere.setAttribute('radius', '0.32');
        // Matte material properties (no glossiness)
        sphere.setAttribute('material', 'roughness: 1.0; metalness: 0.0');

        const pos = getRandom360Coordinates();
        sphere.setAttribute('position', `${pos.x.toFixed(2)} ${pos.y.toFixed(2)} ${pos.z.toFixed(2)}`);

        // Click / Fuse gaze hit handler
        sphere.addEventListener('click', (evt) => {
          if (!isPlaying) return;
          evt.stopPropagation();
          playDingSound();
          score++;
          scoreText.setAttribute('value', `Score: ${score}`);
          relocateSphere(sphere, true);
        });

        targetContainer.appendChild(sphere);
        startTargetRelocateTimer(sphere);
      }

      // Assign movement modes ensuring strictly 1 or 2 spheres move
      updateAllTargetMovements();
    }

    // Clears all active target timers
    function clearAllTargetTimers() {
      const spheres = targetContainer.querySelectorAll('a-sphere');
      spheres.forEach(sphere => clearTargetRelocateTimer(sphere));
    }

    // Start Game Function
    function startGame() {
      playDingSound();
      score = 0;
      timeRemaining = 60;
      isPlaying = true;

      scoreText.setAttribute('value', 'Score: 0');
      timerText.setAttribute('value', 'Time: 60s');

      startScreen.setAttribute('visible', 'false');
      gameOverScreen.setAttribute('visible', 'false');

      createTargets();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeRemaining--;
        timerText.setAttribute('value', `Time: ${timeRemaining}s`);

        if (timeRemaining <= 0) {
          endGame();
        }
      }, 1000);
    }

    // End Game Function
    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);
      clearAllTargetTimers();
      targetContainer.innerHTML = '';

      finalScoreText.setAttribute('value', `Final Score: ${score}`);
      gameOverScreen.setAttribute('visible', 'true');
    }

    // Attach Event Listeners
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    window.addEventListener('click', () => {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });
  </script>
</body>
</html>
